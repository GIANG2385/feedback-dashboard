<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Phản Hồi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navigation -->
  <header class="bg-blue-600 shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="text-white font-semibold text-lg">Phản Hồi Khách Hàng</span>
      <nav id="main-nav" class="flex gap-2"></nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Xem Phản Hồi (Admin)</h1>

    <!-- Table container -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div id="table-wrap" class="overflow-x-auto">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <script src="../shared/nav.js"></script>
  <script>
    function formatDate(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function ratingStars(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function ratingColor(n) {
      if (n <= 2) return 'text-red-500';
      if (n === 3) return 'text-yellow-500';
      return 'text-green-600';
    }

    function render() {
      const entries = JSON.parse(localStorage.getItem('feedbackEntries') || '[]');
      const wrap = document.getElementById('table-wrap');

      if (entries.length === 0) {
        wrap.innerHTML = `
          <div class="px-6 py-16 text-center text-gray-400 text-sm">
            Chưa có phản hồi nào.
          </div>`;
        return;
      }

      const rows = [...entries]
        .sort((a, b) => b.id - a.id)
        .map(e => `
          <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
            <td class="px-4 py-3 text-sm text-gray-600 whitespace-nowrap">${formatDate(e.timestamp)}</td>
            <td class="px-4 py-3 text-sm text-gray-700">${e.location}</td>
            <td class="px-4 py-3 text-sm font-medium ${ratingColor(e.rating)} whitespace-nowrap" title="${e.rating}/5">${ratingStars(e.rating)}</td>
            <td class="px-4 py-3 text-sm text-gray-700">${e.name || '<span class="text-gray-400 italic">Ẩn danh</span>'}</td>
            <td class="px-4 py-3 text-sm text-gray-700">${e.comment}</td>
          </tr>`).join('');

      wrap.innerHTML = `
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">Ngày</th>
              <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Khu vực</th>
              <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Đánh giá</th>
              <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Họ tên</th>
              <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Nhận xét</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    render();
  </script>
</body>
</html>
