<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-3xl mb-2">🔐</div>
      <h1 class="text-xl font-bold text-gray-800">Đăng nhập Admin</h1>
      <p class="text-sm text-gray-500 mt-1">Chỉ quản trị viên mới có quyền truy cập</p>
    </div>

    <div id="error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

    <div class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" type="email" placeholder="admin@example.com"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
        <input id="password" type="password" placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button id="btn"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg transition-colors">
        Đăng nhập
      </button>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">
      <a href="submit.html" class="text-blue-600 hover:underline">← Quay lại trang gửi phản hồi</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: "AIzaSyC9b8MhbeSNG6R7f23_1l2BDc9jLzANMPM",
      authDomain: "group13-15333.firebaseapp.com",
      projectId: "group13-15333",
    });
    const auth = getAuth(app);

    // Already logged in → go straight to admin
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'admin.html';
    });

    const btn = document.getElementById('btn');
    const errEl = document.getElementById('error');

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      errEl.classList.add('hidden');

      if (!email || !password) {
        errEl.textContent = 'Vui lòng nhập email và mật khẩu.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang đăng nhập…';
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged above will redirect
      } catch (e) {
        const msg = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
          ? 'Email hoặc mật khẩu không đúng.'
          : 'Đăng nhập thất bại. Vui lòng thử lại.';
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
      }
    }

    btn.addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
